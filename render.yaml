services:
  - type: web
    name: mavis-sleepsync-app
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
